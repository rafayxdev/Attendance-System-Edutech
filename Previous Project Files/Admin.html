<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --bg:#070d1e; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08); --blue:#38bdf8; --indigo:#6366f1; --green:#10b981; --red:#f43f5e; --amber:#f59e0b; --text:rgba(255,255,255,0.88); --muted:rgba(255,255,255,0.45); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .page-wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo-badge { width: 44px; height: 44px; background: linear-gradient(135deg, var(--blue), var(--indigo)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header h1 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #fff 40%, var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .header-right { display: flex; gap: 10px; align-items: center; }
    .admin-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--blue); padding: 6px 12px; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.2); border-radius: 20px; }
    .logout-btn { background: rgba(244,63,94,0.1); color: #fb7185; border: 1px solid rgba(244,63,94,0.25); padding: 7px 14px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
    .logout-btn:hover { background: rgba(244,63,94,0.2); }
    .export-btn { background: linear-gradient(135deg, var(--blue), var(--indigo)); color: white; border: none; padding: 9px 18px; border-radius: 10px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: all 0.3s; }
    .export-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(56,189,248,0.25); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }
    .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
    .stat-card.blue::after { background: linear-gradient(90deg, var(--blue), transparent); }
    .stat-card.green::after { background: linear-gradient(90deg, var(--green), transparent); }
    .stat-card.red::after { background: linear-gradient(90deg, var(--red), transparent); }
    .stat-card.amber::after { background: linear-gradient(90deg, var(--amber), transparent); }
    .stat-icon { width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:14px; }
    .stat-card.blue .stat-icon { background: rgba(56,189,248,0.15); color: var(--blue); }
    .stat-card.green .stat-icon { background: rgba(16,185,129,0.15); color: var(--green); }
    .stat-card.red .stat-icon { background: rgba(244,63,94,0.15); color: var(--red); }
    .stat-card.amber .stat-icon { background: rgba(245,158,11,0.15); color: var(--amber); }
    .stat-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .controls-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
    .search-wrap input { width: 100%; padding: 11px 16px 11px 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: all 0.3s; }
    .search-wrap input:focus { border-color: rgba(56,189,248,0.4); background: rgba(255,255,255,0.06); box-shadow: 0 0 0 3px rgba(56,189,248,0.08); }
    .filter-group { display: flex; gap: 6px; }
    .filter-btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: white; }
    .filter-btn.active { background: rgba(56,189,248,0.12); border-color: rgba(56,189,248,0.4); color: var(--blue); }
    input[type="date"] { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; cursor: pointer; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; cursor: pointer; }
    .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
    .table-header-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .table-title { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
    .table-count { font-size: 12px; color: var(--muted); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 750px; }
    thead th { text-align: left; padding: 13px 16px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }
    td { padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; vertical-align: middle; }
    .name-cell strong { display: block; font-size: 14px; font-weight: 500; }
    .name-cell span { font-size: 11px; color: var(--muted); margin-top: 1px; display: block; }
    .id-badge { background: #e0e7ff; color: #4338ca; padding: 2px 8px; border-radius: 20px; font-weight: bold; font-size: 11px; }
    .time-cell { font-size: 15px; font-family: 'Syne', sans-serif; font-weight: 600; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .badge-timein { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
    .badge-timeout { background: rgba(99,102,241,0.12); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.2); }
    .badge-late { background: rgba(244,63,94,0.12); color: #fb7185; border: 1px solid rgba(244,63,94,0.2); }
    .badge-ontime { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.15); }
    .badge-outside { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .badge-campus { background: rgba(56,189,248,0.08); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.15); }
    .ip-text { font-family: monospace; font-size: 11px; color: var(--muted); }
    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
    .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 14px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
    .loading i { animation: spin 1s linear infinite; margin-right: 8px; }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="header">
    <div class="header-left">
      <div class="logo-badge">🎓</div>
      <div>
        <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff 40%,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">EduTech Admin</div>
        <div class="header-sub" id="currentDate"></div>
      </div>
    </div>
    <div class="header-right">
      <div class="admin-badge" id="adminBadge"><i class="fas fa-shield-alt"></i><span id="adminEmail">Admin</span></div>
      <button class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      <button class="export-btn" onclick="exportCSV()"><i class="fas fa-download"></i> Export CSV</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value" id="statPresent">—</div><div class="stat-label">Present Today</div></div>
    <div class="stat-card red"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-value" id="statLate">—</div><div class="stat-label">Late Arrivals</div></div>
    <div class="stat-card green"><div class="stat-icon"><i class="fas fa-sign-out-alt"></i></div><div class="stat-value" id="statTimeouts">—</div><div class="stat-label">Checked Out</div></div>
    <div class="stat-card amber"><div class="stat-icon"><i class="fas fa-user-friends"></i></div><div class="stat-value" id="statGuests">—</div><div class="stat-label">Guests Today</div></div>
  </div>

  <div class="controls-bar">
    <div class="search-wrap">
      <i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search name, category, status, IP..." oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <button class="filter-btn active" data-filter="today" onclick="setDateFilter('today',this)">Today</button>
      <button class="filter-btn" data-filter="yesterday" onclick="setDateFilter('yesterday',this)">Yesterday</button>
      <button class="filter-btn" data-filter="all" onclick="setDateFilter('all',this)">All Records</button>
    </div>
    <input type="date" id="datePicker" onchange="setDateFilter('custom',null)" title="Filter by date">
  </div>

  <div class="table-card">
    <div class="table-header-bar">
      <span class="table-title"><i class="fas fa-table" style="margin-right:8px;opacity:0.5;"></i>Attendance Logs</span>
      <span class="table-count" id="rowCount">Loading...</span>
    </div>
    <div class="table-scroll">
      <table id="adminTable">
        <thead><tr><th>Time</th><th>ID</th><th>Full Name</th><th>Category</th><th>Type</th><th>Location</th><th>Status</th><th>Device IP</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="8"><div class="loading"><i class="fas fa-circle-notch"></i> Loading data...</div></td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var allData = [], activeFilter = 'today', adminEmail = '';
  function initAdminSession() {
    var params = new URLSearchParams(window.location.search);
    // adminToken = params.get('token') || sessionStorage.getItem('et_token') || '';
    adminEmail = sessionStorage.getItem('et_email') || 'Admin';

    // if (!adminToken) { redirectToLogin(); return; }
    // sessionStorage.setItem('et_token', adminToken);
    document.getElementById('adminEmail').textContent = adminEmail;
  }

  function redirectToLogin() {
    sessionStorage.clear();
    google.script.run.withSuccessHandler(function(url) { window.top.location.href = url + '?page=Login'; }).getScriptUrl();
  }

  function doLogout() {
    // google.script.run.logoutToken(adminToken);
    sessionStorage.clear(); redirectToLogin();
  }

  window.onload = function() {
    initAdminSession();
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    document.getElementById('datePicker').value = new Date().toISOString().split('T')[0];
    refreshData(); setInterval(refreshData, 30000);
  };

  function refreshData() {
    google.script.run.withSuccessHandler(function(s) {
      if (!s) { redirectToLogin(); return; }
      document.getElementById('statPresent').innerText  = s.present;
      document.getElementById('statLate').innerText     = s.late;
      document.getElementById('statGuests').innerText   = s.outside;
      document.getElementById('statTimeouts').innerText = s.timeouts || 0;
    }).getAdminStats();

    google.script.run.withSuccessHandler(function(data) {
      if (!data) { redirectToLogin(); return; }
      allData = data; applyFilters();
    }).getAdminData();
  }

  function setDateFilter(type, btn) {
    activeFilter = type; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (type === 'custom') document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    applyFilters();
  }

  function getDateStr(date) { return date.toISOString().split('T')[0]; }

  function applyFilters() {
    var search = document.getElementById('searchInput').value.toLowerCase().trim();
    var today  = getDateStr(new Date()), yday = getDateStr(new Date(Date.now() - 86400000)), picked = document.getElementById('datePicker').value;
    var rows = [];

    for (var i = 1; i < allData.length; i++) {
      var row = allData[i]; if (!row[0] || !row[2]) continue;
      var rowDate = ""; try { var d = new Date(row[0]); if (!isNaN(d)) rowDate = getDateStr(d); } catch(e) {}
      
      if (activeFilter === 'today' && rowDate !== today) continue;
      if (activeFilter === 'yesterday' && rowDate !== yday) continue;
      if (activeFilter === 'custom' && rowDate !== picked) continue;

      if (search) {
        var combined = (row.join(" ")).toLowerCase();
        if (!combined.includes(search)) continue;
      }
      rows.push(row);
    }
    renderTable(rows);
  }

  function renderTable(rows) {
    var tbody = document.getElementById('tableBody');
    document.getElementById('rowCount').innerText = rows.length + " record" + (rows.length !== 1 ? "s" : "");
    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><p>No records found.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(row => {
      var timeStr = "—"; try { var d = new Date(row[0]); if (!isNaN(d)) timeStr = d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); } catch(e) {}
      
      var uid       = row[1] !== "N/A" ? `<span class="id-badge">${row[1]}</span>` : `<span style="color:#94a3b8;font-size:11px;">GUEST</span>`;
      var nameStr   = row[2] || 'N/A'; var catStr = row[3] || 'N/A';
      var typeStr   = (row[5] || "N/A").trim(); var locStr = (row[6] || "Unknown").trim();
      var statusStr = (row[8] || "").trim().toUpperCase(); var ipStr = row[9] || 'N/A';
      
      var typeBadge = typeStr === "Time In" ? `<span class="badge badge-timein"><i class="fas fa-sign-in-alt"></i> ${typeStr}</span>` : `<span class="badge badge-timeout"><i class="fas fa-sign-out-alt"></i> ${typeStr}</span>`;
      var statusBadge = statusStr === "LATE" ? `<span class="badge badge-late"><i class="fas fa-exclamation-circle"></i> Late</span>` : `<span class="badge badge-ontime"><i class="fas fa-check-circle"></i> On Time</span>`;
      var locBadge = locStr.toUpperCase().includes("OUTSIDE") ? `<span class="badge badge-outside"><i class="fas fa-map-marker-alt"></i> ${locStr}</span>` : `<span class="badge badge-campus"><i class="fas fa-building"></i> ${locStr}</span>`;

      return `<tr>
        <td class="time-cell">${timeStr}</td><td>${uid}</td>
        <td class="name-cell"><strong>${nameStr}</strong><span>${catStr}</span></td>
        <td>${catStr}</td><td>${typeBadge}</td><td>${locBadge}</td><td>${statusBadge}</td><td class="ip-text">${ipStr}</td>
      </tr>`;
    }).join('');
  }

  function exportCSV() {
    var rows = [['Time','Unique ID','Full Name','Category','Purpose','Type','Location','Email','Status','IP']];
    for (var i = 1; i < allData.length; i++) { if (allData[i][2]) rows.push(allData[i]); }
    var csv  = rows.map(r => r.map(c => '"'+(c||"").toString().replace(/"/g,'""')+'"').join(',')).join('\n');
    var blob = new Blob([csv], {type:'text/csv'}); var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = 'attendance_'+new Date().toISOString().split('T')[0]+'.csv'; a.click(); URL.revokeObjectURL(url);
}
</script>

<script>
(function() {
  var overlay = document.createElement('div');
  overlay.id = 'securityGate';
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#070d1e;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:"DM Sans",sans-serif;text-align:center;padding:20px;transition:opacity 0.5s;';
  overlay.innerHTML = '<div style="font-size:40px;margin-bottom:20px;color:#38bdf8;"><i class="fas fa-spinner fa-spin"></i></div><h2 id="sg-title" style="font-family:\\'Syne\\',sans-serif;font-size:24px;margin:0 0 10px 0;">Verifying Security Clearance</h2><p id="sg-msg" style="opacity:0.7;max-width:350px;line-height:1.5;font-size:14px;">Checking University Network and Campus Location...</p>';
  document.documentElement.appendChild(overlay);

  var ipPassed = false, geoPassed = false, failed = false;

  function denyAccess(reason) {
    if (failed) return;
    failed = true;
    overlay.innerHTML = '<div style="font-size:52px;color:#f87171;margin-bottom:20px;">🔒</div><h2 style="font-family:\\'Syne\\',sans-serif;font-size:24px;color:#f87171;margin:0 0 10px 0;">Access Denied</h2><p style="opacity:0.9;max-width:350px;line-height:1.5;font-size:14px;">' + reason + '<br><br><span style="opacity:0.5;font-size:12px;">You must be connected to the University Wi-Fi Network and physically located on Campus.</span></p>';
  }

  function checkUnlock() {
    if (ipPassed && geoPassed && !failed) {
      overlay.style.opacity = "0";
      setTimeout(() => overlay.remove(), 500);
    }
  }

  // var allowedPrefixes = ["137.59.221.111", "137.59.221.110"]; UNOVERSITY IP
   var allowedPrefixes = ["137.59.223.136"]; //Home IP
  fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(data=>{
    if(allowedPrefixes.some(p => data.ip.startsWith(p))) { ipPassed = true; checkUnlock(); } 
    else { denyAccess("Unauthorized Network Connection."); }
  }).catch(e => denyAccess("Network verification failed."));

  //const CAMPUS_LAT = 25.4031708, CAMPUS_LON = 68.3291588; //UNI LOCATION
  const CAMPUS_LAT = 25.3833456, CAMPUS_LON = 68.3844759; //HOME LOCATION
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        let dist = Math.sqrt(Math.pow(pos.coords.latitude - CAMPUS_LAT, 2) + Math.pow(pos.coords.longitude - CAMPUS_LON, 2));
        if (dist < 0.002) { geoPassed = true; checkUnlock(); } 
        else { denyAccess("You are not located within the University Premises."); }
      },
      function(err) { denyAccess("Location access denied. Please enable GPS."); },
      { timeout: 10000 }
    );
  } else { denyAccess("Your browser does not support location access."); }
})();
</script>
</body>
</html>
